baseURL = 'http://willschenk.com/'
locale = 'en-us'
title = 'Will Schenk'
theme = 'beard'

[params]
  author_name = "Will Schenk"
  author_email = "wschenk@gmail.com"

[security]
  allowContent = ['.*']

[markup.highlight]
  lineNos = true
  lineNumbersInTable = true
  noClasses = false
  style = "tango"

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  includeNewer = true
  threshold = 10
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "section"
    weight = 15
  [[related.indices]]
    name = "date"
    weight = 10

[outputFormats]
  [outputFormats.RSS]
  mediatype = "application/rss"
  baseName = "feed"

[[menus.main]]
name = 'Writing'
pageRef = '/writing'
weight = 10

[[menus.main]]
name = 'About'
pageRef = '/about'
weight = 20

[[menus.footer]]
name = 'Home'
pageRef = '/'
weight = 10

[[menus.footer]]
name = 'Github'
url = 'https://github.com/wschenk'
weight = 20

[[menus.footer]]
name = 'Mastodon'
url = 'https://floss.social/@wschenk'
weight = 30
