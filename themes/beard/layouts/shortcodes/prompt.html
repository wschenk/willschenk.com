{{- $label := .Get "label" | default "Prompt" -}}
<figure class="chat-prompt">
  <figcaption class="chat-prompt-label">
    <span class="chat-prompt-label-text">{{ $label }}</span>
    <button type="button" class="chat-prompt-copy" data-copy-prompt aria-label="Copy prompt">copy</button>
  </figcaption>
  <div class="chat-prompt-body">{{ .Inner | markdownify }}</div>
</figure>
